name: Module - Build & Test
on: workflow_call

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install full Go toolchain
        run: |
          GO_VERSION=$(awk '/^go / { print $2 }' go.mod)
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o "$RUNNER_TEMP/go.tar.gz"
          mkdir -p "$RUNNER_TEMP/go-toolchain"
          tar -C "$RUNNER_TEMP/go-toolchain" -xzf "$RUNNER_TEMP/go.tar.gz"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go-toolchain/go/bin/go" version
      - name: Build
        run: if [ -f go.mod ]; then go build -v ./...; else echo "No go.mod, skipping"; fi
      - name: Run tests with coverage
        run: |
          if [ -f go.mod ]; then
            # Run all tests in a single command to ensure coverage.out is cumulative and not overwritten by xargs.
            go test -v -coverprofile=coverage.out -coverpkg=./... $(go list ./... | grep -v '/cmd/api$' | grep -v '/internal/grpc/aegis/v1$' | grep -v '/internal/grpc/aegis/v2$' | grep -v '/internal/agrpc/aegis/v1$' | grep -v '/internal/agrpc/aegis/v2$')

            # Filter out generated and mock files from the global threshold check.
            grep -v ".pb.go" coverage.out | grep -v "_mock.go" | grep -v "cmd/api" | grep -v "internal/grpc/aegis" | grep -v "internal/agrpc/aegis" > coverage_filtered.out

            COVERAGE=$(go tool cover -func=coverage_filtered.out | grep "^total:" | awk '{print $NF}' | sed 's/%//')
            echo "Filtered coverage: $COVERAGE%"

            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "❌ Filtered coverage ($COVERAGE%) is below the required 80% threshold!"
              exit 1
            fi
            echo "✅ Coverage check passed: $COVERAGE%"
          else
            echo "No go.mod, skipping"
          fi
